name: Tornia-guld Android APK Build

on:
  push:
    branches: [main, "feature/**", "experiment/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK (arm64-v8a)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android NDK and shader compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y glslc
          yes | sdkmanager --licenses
          sdkmanager --install \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;26.1.10909125"

      - name: Build APK
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tornia-guld-Android-APK
          path: build/Tornia-guld-debug.apk
          if-no-files-found: error
          retention-days: 14
