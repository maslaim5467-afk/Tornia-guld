name: 3D math, camera, and mesh tests

on:
  push:
    branches: ["feature/**"]
  pull_request:

permissions:
  contents: read

jobs:
  math3d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Compile and run vector and matrix tests
        run: |
          cc -std=c11 -Wall -Wextra -Werror -pedantic src/math3d.c tests/math3d_test.c -lm -o math3d_test
          ./math3d_test
      - name: Compile and run camera tests
        run: |
          cc -std=c11 -Wall -Wextra -Werror -pedantic src/math3d.c src/camera3d.c tests/camera3d_test.c -lm -o camera3d_test
          ./camera3d_test
      - name: Compile and run mesh tests
        run: |
          cc -std=c11 -Wall -Wextra -Werror -pedantic src/math3d.c src/mesh3d.c tests/mesh3d_test.c -lm -o mesh3d_test
          ./mesh3d_test
