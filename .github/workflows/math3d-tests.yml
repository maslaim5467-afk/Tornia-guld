name: 3D math, camera, mesh, terrain, and GPU layout tests
on:
  push:
    branches: ["feature/**", "experiment/**"]
  pull_request:
permissions:
  contents: read
jobs:
  math3d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Compile and run vector and matrix tests
        run: |
          cc -std=c11 -Wall -Wextra -Werror -pedantic src/math3d.c tests/math3d_test.c -lm -o math3d_test
          ./math3d_test
      - name: Compile and run camera tests
        run: |
          cc -std=c11 -Wall -Wextra -Werror -pedantic src/math3d.c src/camera3d.c tests/camera3d_test.c -lm -o camera3d_test
          ./camera3d_test
      - name: Compile and run sea camera tests
        run: |
          cc -std=c11 -Wall -Wextra -Werror -pedantic src/math3d.c src/camera3d.c src/sea_camera.c tests/sea_camera_test.c -lm -o sea_camera_test
          ./sea_camera_test
      - name: Compile and run mesh tests
        run: |
          cc -std=c11 -Wall -Wextra -Werror -pedantic src/math3d.c src/mesh3d.c tests/mesh3d_test.c -lm -o mesh3d_test
          ./mesh3d_test
      - name: Compile and run procedural terrain tests
        run: |
          cc -std=c11 -Wall -Wextra -Werror -pedantic src/math3d.c src/mesh3d.c src/terrain_generator.c tests/terrain_generator_test.c -lm -o terrain_generator_test
          ./terrain_generator_test
      - name: Compile and run GPU mesh layout tests
        run: |
          cc -std=c11 -Wall -Wextra -Werror -pedantic src/gpu_mesh_layout.c tests/gpu_mesh_layout_test.c -o gpu_mesh_layout_test
          ./gpu_mesh_layout_test
